# Copy 1 word from the end of this command into the TRIG_MUX_CTRL register of
# the ILCU. This Routs input trigger 2 (Integrity Checker Trigger) to the
# Trigger output interface.

CTRL:
    USEGPO: 1
    TRANSIZE: 'word'
    XTYPE: 'continue'
SRCADDR: 'program4_cmd3_store_addr + program4_cmd3_size - 0x4'
DESADDR: 'ilcu_base_address + reg_offset_ilcu_trig_mux_ctrl'
XSIZE:
    SRC: 1
    DES: 1
SRCTRANSCFG:
    SRCMEMATTR: 'normal_non_cacheable_non_shareable'
    MAXBURSTLEN: 0xF
DESTRANSCFG:
    DESMEMATTR: 'device'
GPOVAL0: 0x00000003
LINKADDR: "program4_cmd4_exec_addr"
TRIGMUXCTRL: 0x00000002
